trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  frontendFolder: 'frontend'
  backendFolder: 'CountryFlagAPI'

stages:
  - stage: Install
    displayName: Install dependencies
    jobs:
      - job: InstallFrontendBackend
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'
            displayName: 'Install Node.js'

          - script: |
              cd $(frontendFolder)
              npm ci
            displayName: 'Install Frontend Dependencies'

          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '8.x'
            displayName: 'Install .NET SDK'

          - script: |
              dotnet restore $(backendFolder)
            displayName: 'Restore Backend Dependencies'

  - stage: Test
    displayName: Run Tests
    jobs:
      - job: TestFrontend
        displayName: Frontend Tests
        steps:
          - script: |
              cd $(frontendFolder)
              npm run test -- --ci
            displayName: 'Run Frontend Tests'

      - job: TestBackend
        displayName: Backend Tests
        steps:
          - script: |
              dotnet test CountryFlagAPI.Tests --configuration $(buildConfiguration) --no-restore --verbosity normal
            displayName: 'Run Backend Tests'

  - stage: Build
    displayName: Build Projects
    jobs:
      - job: BuildFrontend
        steps:
          - script: |
              cd $(frontendFolder)
              npm run build
            displayName: 'Build Frontend'

      - job: BuildBackend
        steps:
          - script: |
              dotnet build $(backendFolder) --configuration $(buildConfiguration) --no-restore
            displayName: 'Build Backend'

  - stage: Package
    displayName: Package for Deployment
    jobs:
      - job: PackageArtifacts
        steps:
          - task: CopyFiles@2
            inputs:
              SourceFolder: '$(frontendFolder)/build'
              Contents: '**'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/frontend'
            displayName: 'Package Frontend'

          - task: CopyFiles@2
            inputs:
              SourceFolder: '$(backendFolder)/bin/$(buildConfiguration)/net8.0'
              Contents: '**'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/backend'
            displayName: 'Package Backend'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'CountryFlagSolution'
              publishLocation: 'Container'
            displayName: 'Publish Artifacts'
