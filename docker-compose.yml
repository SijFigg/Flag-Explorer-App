version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: CountryFlagsAPI/src/Dockerfile
    ports:
      - "8000:8080"
    container_name: countryflagsapi
    environment:
      - ASPNETCORE_URLS=http://+:8080

  frontend:
    build:
      context: ./flag-explorer-app
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    container_name: flag-explorer-ui
    depends_on:
      - backend
